name: Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Garder la même signature
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Icône de Jarvis
        run: |
          mkdir -p android/src/main/res/mipmap-xxxhdpi
          cp public/icon-512.png android/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Construire l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Nommer l'APK
        run: |
          find android/build -name "*.apk"
          cp "$(find android/build/outputs/apk/debug -name '*.apk' | head -1)" Jarvis.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Jarvis APK ${{ github.run_number }}
          files: Jarvis.apk
