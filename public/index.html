<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jarvis</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;overflow:hidden;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#e8ebf0}
#stage{position:fixed;inset:0;display:flex;justify-content:center;background:#000}
#art{position:relative;height:100dvh;aspect-ratio:688/1376;overflow:hidden;flex:none}
#bg{position:absolute;left:0;top:-10.9%;width:100%;height:auto;display:block;
  transition:opacity .5s,filter .5s}
.chat #bg{opacity:0}
#bar{position:absolute;left:4.6%;width:90.8%;bottom:3.4%;min-height:8.6%;background:#020203;
  border:1px solid rgba(255,255,255,.55);border-radius:999px;display:flex;align-items:center;gap:6px;
  padding:8px 8px 8px 10px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 18px rgba(220,228,240,.35),inset 0 0 14px rgba(255,255,255,.05)}
#bar.has{flex-wrap:wrap;border-radius:30px;padding:12px 12px 10px;row-gap:4px}
#bar.has #prev{order:0}
#bar.has #inp{order:1;flex:1 0 100%;height:48px;padding:0 6px}
#bar.has #plus{order:2;margin-right:auto}
#bar.has #mic{order:3}
#bar.has #send{order:4}
#inp{flex:1;min-width:0;height:44px;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:0 6px;font-family:inherit}
#inp::placeholder{color:#8e939c}
.ib{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#d9dde4;
  display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#send{background:#d9dde4;color:#000}
#mic.on{background:rgba(255,255,255,.22);animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(255,255,255,.18)}}
#prev{display:none;width:100%;gap:8px;padding:2px 2px 6px}
#prev.on{display:flex}
.thumb{position:relative;width:72px;height:72px;flex:none}
.thumb img{display:block;width:72px;height:72px;object-fit:cover;border-radius:18px;cursor:pointer}
.thumb button{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:0;
  background:rgba(255,255,255,.92);color:#000;font-size:15px;line-height:1;cursor:pointer;padding:0}
.m.ph{background:none;border:0;padding:0;border-radius:0;backdrop-filter:none}
.m.ph img{width:190px;height:190px;max-width:none;max-height:none;object-fit:cover;border-radius:28px;margin:0;cursor:pointer}
#zoom{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.96);align-items:center;justify-content:center}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
#zoom button{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;border-radius:50%;
  border:0;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;cursor:pointer}
#spk{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;z-index:6;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(8,8,10,.6);color:#e8ebf0;display:grid;place-items:center;cursor:pointer;padding:0}
#spk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#spk.off .on-i{display:none}
#spk:not(.off) .off-i{display:none}
#spk.talk{box-shadow:0 0 0 6px rgba(255,255,255,.15)}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:7;max-width:86%;
  background:#fff;color:#000;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
#toast.show{opacity:1}
#menu{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:6;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(8,8,10,.6);color:#e8ebf0;display:grid;place-items:center;cursor:pointer;padding:0}
#menu svg,#dh svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#drawer{display:none;position:absolute;inset:0;z-index:20;background:#000;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px}
#drawer.on{display:flex}
#dh{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 14px}
#dh h2{margin:0;font-size:26px;font-weight:500}
#dh button{background:none;border:0;color:#e8ebf0;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;padding:0}
#dsearch{display:none;margin:0 0 10px;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.3);background:#0b0b0d;color:#fff;font-size:16px;padding:0 16px;outline:0;font-family:inherit}
#dsearch.on{display:block}
#dnew{display:flex;align-items:center;gap:16px;width:100%;height:54px;border:0;border-radius:27px;background:#161618;color:#fff;font-size:18px;padding:0 18px;cursor:pointer;font-family:inherit;margin-bottom:18px}
#dnew svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#dlab{color:#8e939c;font-size:15px;padding:6px 8px 8px}
#dlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ci{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 8px;min-height:54px;border-radius:14px;cursor:pointer}
.ci.cur{background:#161618}
.ci span{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:14px 0}
.ci button{flex:none;width:40px;height:40px;border:0;background:none;color:#8e939c;font-size:22px;cursor:pointer}
.dempty{color:#8e939c;padding:20px 8px;font-size:15px}
.code{align-self:stretch;max-width:100%;background:#0b0b0d;border:1px solid rgba(255,255,255,.22);border-radius:16px;overflow:hidden;animation:in .25s ease both}
.code .ch{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;background:#161618;font-size:13px;color:#aeb3bc}
.code .ch div{display:flex;gap:6px}
.code .ch button{background:#d9dde4;color:#000;border:0;border-radius:999px;padding:7px 13px;font:600 12px system-ui,sans-serif;cursor:pointer}
.code pre{margin:0;padding:12px 14px;overflow:auto;max-height:55vh;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#e8ebf0;white-space:pre;tab-size:2}
#msgs{display:none;position:absolute;left:0;right:0;top:0;bottom:12%;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 18px) 14px 12px;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch}
.chat #msgs{display:flex}
.m{max-width:86%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.4;
  animation:in .25s ease both;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);border-bottom-right-radius:6px}
.m.j{align-self:flex-start;background:rgba(8,8,10,.75);border:1px solid rgba(255,255,255,.18);border-bottom-left-radius:6px}
.m.dots{display:flex;gap:5px}
.m.dots i{width:7px;height:7px;border-radius:50%;background:#9aa0aa;animation:b 1s infinite}
.m.dots i:nth-child(2){animation-delay:.15s}.m.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="art">
    <img id="bg" src="1795271096456.png" alt="">
    <div id="msgs"></div>
    <button id="menu" type="button" aria-label="Discussions"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div id="drawer">
      <div id="dh"><h2>Jarvis</h2><div style="display:flex">
        <button id="dsb" type="button" aria-label="Chercher"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
        <button id="dcl" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
      <input id="dsearch" type="text" placeholder="Chercher une discussion" autocomplete="off">
      <button id="dnew" type="button"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Nouvelle discussion</button>
      <div id="dlab">Discussions</div>
      <div id="dlist"></div>
    </div>
    <button id="spk" type="button" aria-label="Voix de Jarvis">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="on-i" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off-i" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
    <div id="toast"></div>
    <input id="file" type="file" accept="image/*" hidden>
    <div id="bar">
      <div id="prev"><div class="thumb"><img id="pimg" alt="Photo"><button id="pdel" type="button" aria-label="Retirer la photo">&times;</button></div></div>
      <button class="ib" id="plus" type="button" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <input id="inp" type="text" placeholder="Parle à Jarvis" autocomplete="off" enterkeyhint="send">
      <button class="ib" id="mic" type="button" aria-label="Micro"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="ib" id="send" type="button" aria-label="Envoyer"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </div>
</div>
<div id="zoom"><img id="zimg" alt=""><button id="zclose" type="button" aria-label="Fermer">&times;</button></div>

<script>
const CONFIG = { API_URL: "/api/chat", LANG: "fr-FR" };
const $ = (id) => document.getElementById(id);
const stage = $("stage"), msgs = $("msgs"), inp = $("inp"), mic = $("mic");
let history = [], busy = false;

// ---------- Voix de Jarvis (ElevenLabs) ----------
let voiceOn = true;
try { voiceOn = localStorage.getItem("jarvis_voice") !== "off"; } catch (e) {}
const spk = $("spk");
spk.classList.toggle("off", !voiceOn);
const player = new Audio();
let toastT;
function toast(t){
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 3500);
}
function stopSpeak(){
  try { player.pause(); player.currentTime = 0; } catch (e) {}
  spk.classList.remove("talk");
}
player.onended = () => spk.classList.remove("talk");
async function speak(text){
  if (!voiceOn || !text) return;
  try {
    const r = await fetch("/api/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    if (!r.ok) {
      let m = ""; try { m = (await r.json()).reply; } catch (e) {}
      toast("Voix indisponible : " + (m || r.status));
      return;
    }
    const blob = await r.blob();
    if (player.src && player.src.startsWith("blob:")) URL.revokeObjectURL(player.src);
    player.src = URL.createObjectURL(blob);
    spk.classList.add("talk");
    await player.play();
  } catch (e) {
    spk.classList.remove("talk");
    toast("Voix : touche l'écran puis réessaie");
  }
}
spk.addEventListener("click", () => {
  voiceOn = !voiceOn;
  spk.classList.toggle("off", !voiceOn);
  try { localStorage.setItem("jarvis_voice", voiceOn ? "on" : "off"); } catch (e) {}
  if (!voiceOn) stopSpeak(); else toast("Voix activée");
});

// ---------- Discussions enregistrées (sur ce téléphone) ----------
let convs = [], cur = null;
try { convs = JSON.parse(localStorage.getItem("jarvis_convs") || "[]"); } catch (e) { convs = []; }
function saveConvs(){ try { localStorage.setItem("jarvis_convs", JSON.stringify(convs.slice(0, 100))); } catch (e) {} }
function newChat(){
  cur = null; history = []; msgs.innerHTML = ""; stage.classList.remove("chat"); stopSpeak(); clearPhoto();
}
function record(userText, hadPhoto, reply){
  if (!cur) {
    cur = { id: String(Date.now()), t: Date.now(), title: (userText || "Photo").slice(0, 48), m: [] };
    convs.unshift(cur);
  }
  cur.m.push({ r: "u", c: userText, p: hadPhoto ? 1 : 0 }, { r: "j", c: reply });
  cur.t = Date.now();
  convs.sort((a, b) => b.t - a.t);
  saveConvs();
}
function openConv(id){
  const c = convs.find((x) => x.id === id); if (!c) return;
  stopSpeak(); msgs.innerHTML = ""; cur = c; history = [];
  for (const x of c.m) {
    if (x.r === "u") { if (x.p) add("📷 Photo envoyée", "u"); add(x.c, "u"); }
    else add(x.c, "j");
  }
  history = c.m.slice(-10).map((x) => ({ role: x.r === "u" ? "user" : "assistant", content: x.c || "" }));
  closeDrawer();
}
function drawList(){
  const q = $("dsearch").value.trim().toLowerCase();
  const box = $("dlist"); box.innerHTML = "";
  const list = convs.filter((c) => !q || c.title.toLowerCase().includes(q) || c.m.some((x) => (x.c || "").toLowerCase().includes(q)));
  if (!list.length) { box.innerHTML = '<div class="dempty">' + (q ? "Aucun résultat." : "Aucune discussion pour l'instant.") + "</div>"; return; }
  for (const c of list) {
    const row = document.createElement("div");
    row.className = "ci" + (cur && cur.id === c.id ? " cur" : "");
    const sp = document.createElement("span"); sp.textContent = c.title;
    const del = document.createElement("button"); del.textContent = "×"; del.setAttribute("aria-label", "Supprimer");
    row.onclick = () => openConv(c.id);
    del.onclick = (e) => {
      e.stopPropagation();
      if (!confirm("Supprimer cette discussion ?")) return;
      convs = convs.filter((x) => x.id !== c.id); saveConvs();
      if (cur && cur.id === c.id) newChat();
      drawList();
    };
    row.append(sp, del); box.appendChild(row);
  }
}
function openDrawer(){ $("dsearch").value = ""; drawList(); $("drawer").classList.add("on"); }
function closeDrawer(){ $("drawer").classList.remove("on"); $("dsearch").classList.remove("on"); }
$("menu").addEventListener("click", openDrawer);
$("dcl").addEventListener("click", closeDrawer);
$("dsb").addEventListener("click", () => { $("dsearch").classList.toggle("on"); if ($("dsearch").classList.contains("on")) $("dsearch").focus(); });
$("dsearch").addEventListener("input", drawList);
$("dnew").addEventListener("click", () => { newChat(); closeDrawer(); });

function add(text, who, img){
  stage.classList.add("chat");
  if (img) {
    const p = document.createElement("div");
    p.className = "m u ph";
    const i = document.createElement("img");
    i.src = img; i.className = "zoomable"; i.alt = "Photo";
    p.appendChild(i);
    msgs.appendChild(p);
  }
  if (text) {
    if (who === "j" && text.indexOf("```") !== -1) addRich(text);
    else {
      const d = document.createElement("div");
      d.className = "m " + who;
      d.textContent = text;
      msgs.appendChild(d);
    }
  }
  msgs.scrollTop = msgs.scrollHeight;
}

// Réponse avec du code : texte normal + cartes de code (Copier / Télécharger)
const EXT = { html: "html", css: "css", javascript: "js", js: "js", python: "py", py: "py", java: "java", kotlin: "kt", json: "json", sql: "sql", bash: "sh", sh: "sh", xml: "xml", ts: "ts", typescript: "ts", jsx: "jsx" };
function bubble(t){
  t = t.trim(); if (!t) return;
  const d = document.createElement("div"); d.className = "m j"; d.textContent = t; msgs.appendChild(d);
}
function addRich(text){
  const re = /```([\w+-]*)[ \t]*\n?([\s\S]*?)(```|$)/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    bubble(text.slice(last, m.index));
    const lang = (m[1] || "code").toLowerCase(), code = m[2].replace(/\n$/, "");
    const box = document.createElement("div"); box.className = "code";
    const head = document.createElement("div"); head.className = "ch";
    const nm = document.createElement("span"); nm.textContent = lang;
    const act = document.createElement("div");
    const cp = document.createElement("button"); cp.textContent = "Copier";
    cp.onclick = async () => {
      try { await navigator.clipboard.writeText(code); }
      catch (e) { const t = document.createElement("textarea"); t.value = code; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
      cp.textContent = "Copié ✓"; setTimeout(() => (cp.textContent = "Copier"), 1800);
    };
    const dl = document.createElement("button"); dl.textContent = "Télécharger";
    dl.onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([code], { type: "text/plain" }));
      a.download = "jarvis." + (EXT[lang] || "txt"); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
    act.append(cp, dl); head.append(nm, act);
    const pre = document.createElement("pre"); pre.textContent = code;
    box.append(head, pre); msgs.appendChild(box);
    last = re.lastIndex;
    if (m[3] === "") break;
  }
  bubble(text.slice(last));
}
function spoken(t){
  if (t.indexOf("```") === -1) return t;
  const s = t.replace(/```[\s\S]*?(```|$)/g, " ").replace(/\s+/g, " ").trim();
  return s || "Voilà, le code est à l'écran.";
}

async function ask(text){
  const photo = pending;
  if (busy || (!text && !photo)) return;
  busy = true;
  stopSpeak();
  let shown = text;
  if (!text && photo) { text = "Regarde cette photo et dis-moi ce que tu vois."; shown = ""; }
  add(shown, "u", photo ? photo.url : null);
  clearPhoto();
  const wait = document.createElement("div");
  wait.className = "m j dots";
  wait.innerHTML = "<i></i><i></i><i></i>";
  msgs.appendChild(wait);
  msgs.scrollTop = msgs.scrollHeight;
  let reply;
  try {
    const r = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history, image: photo ? photo.data : undefined, mime: photo ? "image/jpeg" : undefined })
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    reply = data.reply || ("Erreur du serveur (" + r.status + ")");
  } catch (e) {
    reply = "Je n'arrive pas à joindre le serveur. Vérifie ta connexion.";
  }
  wait.remove();
  add(reply, "j");
  speak(spoken(reply));
  if (!/^(Je n'arrive pas|Erreur du serveur|Jarvis est très sollicité)/.test(reply)) record(shown || "", !!photo, reply);
  history.push({ role: "user", content: text }, { role: "assistant", content: reply });
  history = history.slice(-10);
  busy = false;
}

let pending = null;
function clearPhoto(){
  pending = null;
  $("prev").classList.remove("on");
  $("bar").classList.remove("has");
  $("pimg").removeAttribute("src");
  $("file").value = "";
}
function loadPhoto(file){
  if (!file || !file.type.startsWith("image/")) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 1024, k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.82);
      pending = { url, data: url.split(",")[1] };
      $("pimg").src = url;
      $("prev").classList.add("on");
      $("bar").classList.add("has");
    };
    im.onerror = () => add("Je n'arrive pas à lire cette photo. Essaie-en une autre.", "j");
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
$("file").addEventListener("change", (e) => loadPhoto(e.target.files[0]));
$("pdel").addEventListener("click", clearPhoto);

// Toucher une photo : l'ouvrir en grand
function openZoom(src){ $("zimg").src = src; $("zoom").classList.add("on"); }
function closeZoom(){ $("zoom").classList.remove("on"); $("zimg").removeAttribute("src"); }
$("pimg").addEventListener("click", () => { if (pending) openZoom(pending.url); });
msgs.addEventListener("click", (e) => { if (e.target.classList.contains("zoomable")) openZoom(e.target.src); });
$("zoom").addEventListener("click", closeZoom);

function envoyer(){
  const t = inp.value.trim();
  inp.value = "";
  ask(t);
}
$("send").addEventListener("click", envoyer);
$("plus").addEventListener("click", () => $("file").click());
inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); envoyer(); } });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
mic.addEventListener("click", () => {
  if (!SR) { add("Le micro n'est pas disponible sur ce navigateur. Utilise Chrome.", "j"); return; }
  if (listening) { rec.stop(); return; }
  stopSpeak();
  rec = new SR();
  rec.lang = CONFIG.LANG;
  rec.interimResults = false;
  rec.onstart = () => { listening = true; mic.classList.add("on"); };
  rec.onend = () => { listening = false; mic.classList.remove("on"); };
  rec.onerror = () => { listening = false; mic.classList.remove("on"); };
  rec.onresult = (ev) => ask(ev.results[0][0].transcript.trim());
  rec.start();
});
</script>
</body>
</html>
