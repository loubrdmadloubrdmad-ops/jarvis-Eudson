<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jarvis</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;overflow:hidden;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#e8ebf0}
#stage{position:fixed;inset:0;display:flex;justify-content:center;background:#000}
#art{position:relative;height:100dvh;aspect-ratio:688/1376;overflow:hidden;flex:none}
#art img{position:absolute;left:0;top:-10.9%;width:100%;height:auto;display:block;
  transition:opacity .5s,filter .5s}
.chat #art img{opacity:.22;filter:blur(3px)}
#inp{position:absolute;left:18.6%;top:89.8%;width:50.5%;height:5.3%;
  background:#020202;border:0;outline:0;color:#fff;font-size:16px;padding:0 4px}
#inp::placeholder{color:#8e939c}
.hot{position:absolute;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:transparent;border:0;border-radius:50%;cursor:pointer;padding:0}
#mic{left:75.9%;top:92.3%}
#send{left:86.5%;top:92.3%}
#mic.on{background:rgba(255,255,255,.25);animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 8px rgba(255,255,255,.18)}}
#msgs{display:none;position:absolute;left:0;right:0;top:0;bottom:12%;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 18px) 14px 12px;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch}
.chat #msgs{display:flex}
.m{max-width:86%;padding:12px 16px;border-radius:20px;font-size:16px;line-height:1.4;
  animation:in .25s ease both;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);border-bottom-right-radius:6px}
.m.j{align-self:flex-start;background:rgba(8,8,10,.75);border:1px solid rgba(255,255,255,.18);border-bottom-left-radius:6px}
.m.dots{display:flex;gap:5px}
.m.dots i{width:7px;height:7px;border-radius:50%;background:#9aa0aa;animation:b 1s infinite}
.m.dots i:nth-child(2){animation-delay:.15s}.m.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="art">
    <img src="1795271096456.png" alt="">
    <div id="msgs"></div>
    <input id="inp" type="text" placeholder="Essayez de parler à Jarvis" autocomplete="off" enterkeyhint="send">
    <button class="hot" id="mic" aria-label="Micro"></button>
    <button class="hot" id="send" aria-label="Envoyer"></button>
  </div>
</div>

<script>
const CONFIG = { API_URL: "/api/chat", LANG: "fr-FR" };
const $ = (id) => document.getElementById(id);
const stage = $("stage"), msgs = $("msgs"), inp = $("inp"), mic = $("mic");
let history = [], busy = false;

function add(text, who){
  stage.classList.add("chat");
  const d = document.createElement("div");
  d.className = "m " + who;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

async function ask(text){
  if (busy || !text) return;
  busy = true;
  add(text, "u");
  const wait = document.createElement("div");
  wait.className = "m j dots";
  wait.innerHTML = "<i></i><i></i><i></i>";
  msgs.appendChild(wait);
  msgs.scrollTop = msgs.scrollHeight;
  let reply;
  try {
    const r = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history })
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    reply = data.reply || ("Erreur du serveur (" + r.status + ")");
  } catch (e) {
    reply = "Je n'arrive pas à joindre le serveur. Vérifie ta connexion.";
  }
  wait.remove();
  add(reply, "j");
  history.push({ role: "user", content: text }, { role: "assistant", content: reply });
  history = history.slice(-10);
  busy = false;
}

function envoyer(){
  const t = inp.value.trim();
  inp.value = "";
  ask(t);
}
$("send").addEventListener("click", envoyer);
inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); envoyer(); } });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
mic.addEventListener("click", () => {
  if (!SR) { add("Le micro n'est pas disponible sur ce navigateur. Utilise Chrome.", "j"); return; }
  if (listening) { rec.stop(); return; }
  rec = new SR();
  rec.lang = CONFIG.LANG;
  rec.interimResults = false;
  rec.onstart = () => { listening = true; mic.classList.add("on"); };
  rec.onend = () => { listening = false; mic.classList.remove("on"); };
  rec.onerror = () => { listening = false; mic.classList.remove("on"); };
  rec.onresult = (ev) => ask(ev.results[0][0].transcript.trim());
  rec.start();
});
</script>
</body>
</html>
